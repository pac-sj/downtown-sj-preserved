  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="07">
      <span class="stop-badge">Stop 7 of 8</span>
      <h1 class="stop-title">Cathedral Basilica + San Jose Museum of Art</h1>
      <p class="stop-progress">Next: Diridon Station →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Historic Photos</p>

      <figure>
        <img
          src="images/01-original-post-office-sepia.png"
          alt="The original 1892 post office before the 1906 earthquake damaged its clock tower"
          loading="lazy">
        <figcaption>The original 1892 post office before the 1906 earthquake damaged its clock tower.</figcaption>
      </figure>

      <figure>
        <img
          src="images/02-damaged-clock-tower-1906.png"
          alt="The clock tower after the 1906 earthquake, its upper stonework collapsed"
          loading="lazy">
        <figcaption>The same tower after the earthquake, its upper stonework collapsed and never fully restored.</figcaption>
      </figure>

      <figure>
        <img
          src="images/03-sjma-construction-1989.png"
          alt="The San Jose Museum of Art's 1991 expansion under construction in 1989"
          loading="lazy">
        <figcaption>The San Jose Museum of Art's 1991 expansion under construction in 1989, with the original 1892 building still standing at left.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
