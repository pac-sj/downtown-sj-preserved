<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stop 3: Hotel De Anza — Downtown San Jose: Preserved walking tour.">
  <title>Stop 3: Hotel De Anza — Downtown San Jose: Preserved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!--
  ═══════════════════════════════════════════════════
  QR CODE — STOP 3
  Generate a QR code pointing to this page's URL:
    https://[YOUR-DOMAIN]/stop-3/
  Place the printed QR code at the physical stop location.
  ═══════════════════════════════════════════════════
  -->
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="03">
      <span class="stop-badge">Stop 3 of 8</span>
      <h1 class="stop-title">Hotel De Anza</h1>
      <p class="stop-progress">Next: San Pedro Square Market →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Historic Photos</p>

      <figure>
        <img
          src="images/01-hotel-bw-street-view.png"
          alt="The Hotel De Anza in the early 1950s, seen from the street with fire escapes on its facade"
          loading="lazy">
        <figcaption>The Hotel De Anza in the early 1950s, when exterior fire escapes still ran down its facade.</figcaption>
      </figure>

      <figure>
        <img
          src="images/02-neon-sign-closeup.png"
          alt="The hotel's rooftop neon sign in the early 1950s"
          loading="lazy">
        <figcaption>The hotel's rooftop neon sign in the early 1950s, the same design PAC*SJ restored using hand-bent glass and relit in 2025.</figcaption>
      </figure>

      <figure>
        <img
          src="images/03-postcard-wide-view.png"
          alt="1950s postcard view of Hotel De Anza anchoring West Santa Clara Street"
          loading="lazy">
        <figcaption>A 1950s postcard view of Hotel De Anza anchoring West Santa Clara Street.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
      <a href="../stop-4/index.html" class="btn-next">
        <span class="next-label">Next Stop</span>
        <span class="next-name">San Pedro Square Market →</span>
      </a>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="https://www.preservation.org" target="_blank" rel="noopener">PAC*SJ — Preservation Action Council of San Jose</a></p>
    </div>
  </footer>

  <script src="../js/lightbox.js" defer></script>

</body>
</html>
