<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stop 6: South First Street Historic Commercial Corridor — Downtown San Jose: Preserved walking tour.">
  <title>Stop 6: South First Street Historic Commercial Corridor — Downtown San Jose: Preserved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!--

    https://[YOUR-DOMAIN]/stop-6/

</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="06">
      <span class="stop-badge">Stop 6 of 8</span>
      <h1 class="stop-title">South First Street Historic Commercial Corridor</h1>
      <p class="stop-progress">Next: Cathedral Basilica + San Jose Museum of Art →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Historic Photos</p>

      <figure>
        <img
          src="images/01-first-street-postcard-1910.png"
          alt="First Street around 1910 with horse-drawn streetcars running down the center"
          loading="lazy">
        <figcaption>First Street around 1910, with horse-drawn streetcars still running down the center of the block.</figcaption>
      </figure>

      <figure>
        <img
          src="images/02-bank-of-italy-tower-1930.png"
          alt="The Bank of Italy Tower around 1930, then the tallest building between San Francisco and Los Angeles"
          loading="lazy">
        <figcaption>The Bank of Italy Tower around 1930, then the tallest building between San Francisco and Los Angeles.</figcaption>
      </figure>

      <figure>
        <img
          src="images/03-first-street-1930-automobiles.png"
          alt="First Street around 1930, packed with automobiles"
          loading="lazy">
        <figcaption>First Street around 1930, now packed with automobiles just two decades after the postcard above.</figcaption>
      </figure>

      <figure>
        <img
          src="images/04-first-street-1961-kress.png"
          alt="First Street looking south in 1961, Bank of Italy Tower needle spire visible in the distance"
          loading="lazy">
        <figcaption>First Street looking south, in 1961. The Bank of Italy Tower's needle spire rises in the distance, still visible above the rooflines of the shops and department stores that once lined the block.</figcaption>
      </figure>

    </section>

    <hr class="section-divider">

    <section class="photo-section">
      <p class="photo-section-label">Today</p>

      <figure>
        <img
          src="images/05-qmunity-post-street-dusk.png"
          alt="Rainbow flags marking San Jose's QMunity District at dusk"
          loading="lazy">
        <figcaption>The rainbow flags mark San Jose's QMunity District, the city's first officially designated LGBTQ+ neighborhood, formalized in 2020 after decades as the heart of the city's LGBTQ+ nightlife.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
      <a href="../stop-7/index.html" class="btn-next">
        <span class="next-label">Next Stop</span>
        <span class="next-name">Cathedral Basilica + San Jose Museum of Art →</span>
      </a>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="https://www.preservation.org" target="_blank" rel="noopener">PAC*SJ — Preservation Action Council of San Jose</a></p>
    </div>
  </footer>

  <script src="../js/lightbox.js" defer></script>

</body>
</html>
