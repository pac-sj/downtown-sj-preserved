<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stop 4: San Pedro Square Market — Downtown San Jose: Preserved walking tour.">
  <title>Stop 4: San Pedro Square Market — Downtown San Jose: Preserved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!--
  ═══════════════════════════════════════════════════
  QR CODE — STOP 4
  Generate a QR code pointing to this page's URL:
    https://[YOUR-DOMAIN]/stop-4/
  Place the printed QR code at the physical stop location.
  ═══════════════════════════════════════════════════
  -->
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="04">
      <span class="stop-badge">Stop 4 of 8</span>
      <h1 class="stop-title">San Pedro Square Market</h1>
      <p class="stop-progress">Next: Main Post Office &amp; St. James Square →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Historic Photos</p>

      <figure class="portrait">
        <img
          src="images/01-carmella-fallon-portrait.png"
          alt="Portrait of Carmela Fallon, 1868"
          loading="lazy">
        <figcaption>Carmela Fallon in 1868.</figcaption>
      </figure>

      <figure class="portrait">
        <img
          src="images/02-thomas-fallon-portrait.png"
          alt="Portrait of Thomas Fallon, 1868"
          loading="lazy">
        <figcaption>Thomas Fallon in 1868.</figcaption>
      </figure>

      <figure>
        <img
          src="images/03-fallon-house-1868.png"
          alt="The Fallon House in 1868, seen from the west on open land at the edge of town"
          loading="lazy">
        <figcaption>The Fallon House in 1868, seen from the west when it still stood on open land at the edge of town.</figcaption>
      </figure>

      <figure>
        <img
          src="images/04-fallon-house-italia-hotel-1967.png"
          alt="The Fallon House operating as Italia Hotel with Manny's Cellar, 1967"
          loading="lazy">
        <figcaption>The Fallon House as Italia Hotel, also housing Manny's Cellar, in 1967.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
      <a href="../stop-5/index.html" class="btn-next">
        <span class="next-label">Next Stop</span>
        <span class="next-name">Main Post Office &amp; St. James Square →</span>
      </a>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="https://www.preservation.org" target="_blank" rel="noopener">PAC*SJ — Preservation Action Council of San Jose</a></p>
    </div>
  </footer>

  <script src="../js/lightbox.js" defer></script>

</body>
</html>
