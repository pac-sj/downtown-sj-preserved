<head>
  <meta charset="UTF-8">

  <title>Stop 5: Main Post Office & St. James Square — Downtown San Jose: Preserved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!--

<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="05">
      <span class="stop-badge">Stop 5 of 8</span>
      <h1 class="stop-title">Main Post Office &amp; St. James Square</h1>
      <p class="stop-progress">Next: South First Street Historic Commercial Corridor →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Historic Photos</p>

      <figure>
        <img
          src="images/01-st-james-square-postcard.png"
          alt="St. James Square in the early 1900s showing the courthouse's original copper dome"
          loading="lazy">
        <figcaption>St. James Square in the early 1900s, showing the courthouse's original copper dome before the 1931 fire melted it.</figcaption>
      </figure>

      <figure>
        <img
          src="images/02-mckinley-stereograph.png"
          alt="President McKinley addressing the crowd in St. James Park in 1901"
          loading="lazy">
        <figcaption>President McKinley addressing the crowd in St. James Park in 1901, four months before his assassination.</figcaption>
      </figure>

      <figure class="portrait">
        <img
          src="images/03-brooke-hart-portrait.png"
          alt="Portrait of Brooke Hart, age 22"
          loading="lazy">
        <figcaption>Brooke Hart, 22, shortly after graduating from Santa Clara University and months before his kidnapping and murder later that year.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
      <a href="../stop-6/index.html" class="btn-next">
        <span class="next-label">Next Stop</span>
        <span class="next-name">South First Street Historic Commercial Corridor →</span>
      </a>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="https://www.preservation.org" target="_blank" rel="noopener">PAC*SJ — Preservation Action Council of San Jose</a></p>
    </div>
  </footer>

  <script src="../js/lightbox.js" defer></script>
