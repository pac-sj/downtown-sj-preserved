  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stop 2: Google & San Jose Water Works — Downtown San Jose: Preserved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="back-home">← All Stops</a>
      <span class="site-brand">Downtown San Jose: Preserved</span>
    </div>
  </header>

  <main class="container">

    <div class="stop-intro" data-stop="02">
      <span class="stop-badge">Stop 2 of 8</span>
      <h1 class="stop-title">Google &amp; San Jose Water Works</h1>
      <p class="stop-progress">Next: Hotel De Anza →</p>
    </div>

    <section class="photo-section">
      <p class="photo-section-label">Downtown West Renderings</p>

      <figure>
        <img
          src="images/01-plaza-rendering.png"
          alt="Conceptual rendering of Downtown West's central plaza with the San Jose Water Works building visible at left"
          loading="lazy">
        <figcaption>A conceptual rendering of Downtown West's planned central plaza, with the San Jose Water Works building visible at left, the one existing structure Google's plan is built around rather than over.</figcaption>
      </figure>

      <figure>
        <img
          src="images/02-boardwalk-rendering.png"
          alt="Conceptual rendering of the river walk planned along the Guadalupe"
          loading="lazy">
        <figcaption>A conceptual rendering of the river walk planned along the Guadalupe, meant to connect the new development back to downtown.</figcaption>
      </figure>

      <figure>
        <img
          src="images/03-evening-street-rendering.png"
          alt="Evening view of Downtown West's proposed retail street"
          loading="lazy">
        <figcaption>An evening view of Downtown West's proposed retail street, part of the original pitch for 7.3 million square feet of office space and thousands of new residents.</figcaption>
      </figure>

      <figure>
        <img
          src="images/04-vision-site-map.png"
          alt="Official site plan for Downtown West"
          loading="lazy">
        <figcaption>The official site plan for Downtown West, laying out the proposed office space, housing units, and parkland across Google's 80-acre site.</figcaption>
      </figure>

    </section>

    <hr class="section-divider">

    <section class="photo-section">
      <p class="photo-section-label">Public Art</p>

      <figure>
        <img
          src="images/05-cows-and-sharks-gallery.png"
          alt="Chicago's Cows on Parade and San Jose's SharkByte fiberglass sharks"
          loading="lazy">
        <figcaption>Chicago's Cows on Parade, the 1999 public art fundraiser that inspired San Jose's own shark project two years later. Some of the 100 fiberglass sharks were commissioned for San Jose's 2001 SharkByte fundraiser, painted by a local artist and later auctioned for charity.</figcaption>
      </figure>

      <figure>
        <img
          src="images/06-sensing-you-dim.png"
          alt="The Sensing You installation under Highway 87, rings quiet between activations"
          loading="lazy">
        <figcaption>The Sensing You installation under Highway 87, its rings quiet between activations.</figcaption>
      </figure>

      <figure>
        <img
          src="images/07-sensing-you-lit.png"
          alt="Sensing You fully lit, triggered by traffic and light"
          loading="lazy">
        <figcaption>Fully lit, Sensing You triggers a pattern when traffic and light set it off.</figcaption>
      </figure>

    </section>

    <nav class="stop-nav" aria-label="Tour navigation">
      <a href="../stop-3/index.html" class="btn-next">
        <span class="next-label">Next Stop</span>
        <span class="next-name">Hotel De Anza →</span>
      </a>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="https://www.preservation.org" target="_blank" rel="noopener">PAC*SJ — Preservation Action Council of San Jose</a></p>
    </div>
  </footer>

  <script src="../js/lightbox.js" defer></script>

</body>
</html>
